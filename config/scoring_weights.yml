# Scoring weights for the CALL-options opportunity score.
# ------------------------------------------------------
# final = (sum of weighted positive component scores) - risk_penalty
#
# All component scores are normalised to a 0..10 scale inside the engine before
# weighting. Weights need NOT sum to 1; the engine normalises by the sum of
# applied weights so a missing component (e.g. no options data) degrades
# gracefully instead of zeroing the score.
#
# IMPORTANT: do NOT tune these weights to perfectly explain past winners.
# Prefer stable priors and validate out-of-sample via the backtest module.

weights:
  thesis: 0.28        # how strongly the company maps to the AI-infra thesis
  thirteen_f: 0.18    # smart-money accumulation / conviction (13F)
  market: 0.22        # momentum, trend, relative strength, drawdown context
  options: 0.18       # options liquidity / IV regime / expiry suitability
  catalyst: 0.14      # earnings, capex, news, 13F-change catalysts

# Risk penalty is SUBTRACTED from the weighted positive score (0..~4 typical).
# Each sub-penalty is additive and capped by max_total_penalty.
risk_penalty:
  max_total_penalty: 4.0
  illiquid_options: 1.0          # OI / volume below hard floors
  wide_spread: 1.0               # bid/ask spread above threshold
  extreme_iv: 0.8                # IV percentile very high (expensive calls)
  near_expiry_lottery: 0.8       # DTE below floor (lottery ticket)
  weak_data_quality: 1.0         # many missing/fallback sources
  no_catalyst: 0.5               # no identified catalyst
  contradictory_13f: 0.7         # smart money reducing/exiting
  excessive_drawdown: 0.6        # deep drawdown without stabilisation
  event_iv_risk: 0.7             # holding a call INTO earnings (IV-crush risk)

# Confidence is a SEPARATE axis from the score: it reflects DATA completeness,
# not conviction. A high score with low confidence must be flagged.
confidence:
  full_data_bonus: 0.0
  # mapping of data_quality (0..1) buckets to a qualitative confidence label
  labels:
    high: 0.80
    medium: 0.55
    low: 0.0

# Gate thresholds for labelling candidates (NOT trade instructions).
gates:
  top_candidate_min_score: 6.5    # eligible for "Top CALL candidates"
  watchlist_min_score: 4.5        # "good thesis, wait for entry"
  reject_below_score: 0.0         # everything else still reported as rejected

# Person-radar THREE-AXIS gate (person_intel/triple_score.py). A tradeable
# candidate may only emerge when ALL THREE axes clear their own bar — a hard
# AND, never a sum that lets one strong axis paper over a weak one. Each 0..10.
person_gates:
  person_signal: 5.0    # how DIRECTLY it hangs on Leo/Thiel/SA LP/Founders Fund
  freshness:     5.0    # how EARLY it is relative to the market
  tradeability:  5.0    # is a liquid call/spread derivable NOW
  watch:         4.0    # below the gate but worth watching
