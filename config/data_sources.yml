# Data source configuration.
# --------------------------
# Default mode is OFFLINE/RESEARCH: the pipeline runs entirely on bundled
# fixtures so it is deterministic, network-free and testable. Switch `mode`
# to "live" (or pass --live on the CLI) to use FREE network sources.
#
# NO PAID APIS. Paid providers are intentionally absent. Any key-based source
# here is FREE-tier and OPTIONAL; the pipeline never requires a key.

mode: offline            # offline | live   (CLI --live overrides to live)

market_data:
  # Order in which providers are attempted in live mode. First success wins;
  # on failure the next is tried, then the offline fixture, then "missing".
  providers: [yfinance, stooq, fixture]
  lookback_days: 260
  request_timeout_s: 10

options_data:
  providers: [yfinance, fixture]
  request_timeout_s: 10
  # When Greeks (delta) are absent, estimate via Black-Scholes and mark them
  # as estimated=true in the output.
  estimate_missing_greeks: true
  risk_free_rate: 0.04

volatility:
  # VIX is read from a free source in live mode; offline uses the fixture value.
  vix_symbol: "^VIX"
  fixture_vix: 17.5

edgar_13f:
  # SEC EDGAR is FREE. A descriptive User-Agent is required by SEC fair-access
  # policy. No key needed. Live fetching is OFF by default (offline mode uses
  # bundled fixtures); enable via CLI --live.
  user_agent: "SituationalAwarenessScanner research (contact: info@pcctradinginc.com)"
  base_url: "https://data.sec.gov"
  request_timeout_s: 15
  rate_limit_per_sec: 5

news_rss:
  enabled: false          # optional, off by default; offline uses no news
  feeds: []

earnings_calendar:
  # Free earnings dates via yfinance in live mode; offline uses fixture.
  provider: yfinance

# Optional paid providers are DISABLED and require explicit opt-in. They are
# listed only so users know they are intentionally excluded by default.
optional_paid_disabled:
  tradier: false
  finnhub: false
  alpha_vantage: false
