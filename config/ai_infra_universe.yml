# AI Infrastructure Equity Universe
# ----------------------------------
# Configurable universe of equities mapped to the AI-infrastructure thesis
# (Aschenbrenner "The Decade Ahead" + adjacent compute/power/supply-chain ideas).
#
# This file is DATA, not code. Edit tickers/relevance/tags here without touching
# Python. `relevance` is a 0..1 prior for how directly the company benefits from
# accelerating AI-infrastructure demand. It is a PRIOR, not a price target.
#
# data_availability is an optional hint ("ok" | "limited" | "unknown") used only
# for reporting/transparency. The live pipeline re-checks data availability at run
# time and degrades gracefully when sources are missing.

meta:
  name: "AI Infrastructure Universe v1"
  thesis_basis: "Aschenbrenner Situational Awareness / The Decade Ahead"
  disclaimer: >
    Research universe only. Relevance scores are subjective priors derived from
    public thesis material and are NOT investment advice or price targets.

