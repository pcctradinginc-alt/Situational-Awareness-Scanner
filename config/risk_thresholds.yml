# Risk thresholds & hard filters for the options candidate generator.
# -------------------------------------------------------------------
# These are RISK GUARDRAILS, not trade triggers. Contracts violating a HARD
# filter are rejected (with a reason). Soft thresholds feed the risk penalty.

# Expiry window (days to expiry). Macro/thesis trades favour longer DTE.
dte:
  min: 30          # hard floor; below this = near-expiry lottery, rejected
  max: 200         # hard ceiling for candidate selection
  preferred_min: 60
  preferred_max: 180

# Strike selection zones, expressed as moneyness = strike / spot.
strike_zones:
  near_the_money: [0.97, 1.03]
  slightly_otm: [1.03, 1.12]
  longer_dated_otm: [1.10, 1.30]   # only for high-conviction longer-dated calls

# Liquidity HARD filters (contract rejected if violated).
liquidity:
  min_open_interest: 50
  min_volume: 5
  max_bid_ask_spread_pct: 0.18     # (ask-bid)/mid; wider = rejected

# Implied-volatility regime handling.
iv:
  # IV percentile (0..100) above which calls are flagged "expensive" (penalty,
  # not rejection). Earnings-driven IV is flagged separately.
  expensive_percentile: 80
  extreme_percentile: 92           # extreme -> larger penalty
  warmup_default_percentile: 50    # used when history is too short to rank

# Underlying market-context guardrails.
market:
  max_drawdown_without_stabilization: 0.35   # 35% off highs & still falling
  min_avg_dollar_volume: 5.0e7               # underlying liquidity sanity floor

# Earnings handling: calls held INTO earnings are IV-driven event trades.
earnings:
  flag_window_days: 10             # earnings within N days -> "event trade" tag

# Data-quality guardrail: candidates assembled from too many fallbacks are
# marked low-confidence and penalised.
data_quality:
  min_acceptable: 0.30             # below this -> reject as "insufficient data"
  low_confidence_below: 0.55
