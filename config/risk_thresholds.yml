# Risk thresholds & hard filters for the options candidate generator.
# -------------------------------------------------------------------
# These are RISK GUARDRAILS, not trade triggers. Contracts violating a HARD
# filter are rejected (with a reason). Soft thresholds feed the risk penalty.

# Expiry window (days to expiry). Macro/thesis trades favour longer DTE.
dte:
  min: 30          # hard floor; below this = near-expiry lottery, rejected
  max: 200         # hard ceiling for candidate selection
  preferred_min: 60
  preferred_max: 180

# Strike selection zones, expressed as moneyness = strike / spot.
strike_zones:
  near_the_money: [0.97, 1.03]
  slightly_otm: [1.03, 1.12]
  longer_dated_otm: [1.10, 1.30]   # only for high-conviction longer-dated calls

# Liquidity HARD filters (contract rejected if violated).
liquidity:
  min_open_interest: 50
  min_volume: 5
  max_bid_ask_spread_pct: 0.18     # (ask-bid)/mid; wider = rejected

# Implied-volatility regime handling.
iv:
  # IV percentile (0..100) above which calls are flagged "expensive" (penalty,
  # not rejection). Earnings-driven IV is flagged separately.
  expensive_percentile: 80
  extreme_percentile: 92           # extreme -> larger penalty
  warmup_default_percentile: 50    # used when history is too short to rank
  # Maps IV-richness (ATM IV / realised vol) to a pseudo-percentile via
  # iv_pct = 50 + slope*(richness - 1). slope=100 means a call priced 30% over
  # realised vol (richness 1.30) hits the "expensive" band and 1.42 hits extreme.
  richness_to_percentile_slope: 100
  fair_richness_max: 1.15          # below this -> genuinely "fair vs realised"

# Underlying market-context guardrails.
market:
  max_drawdown_without_stabilization: 0.35   # 35% off highs & still falling
  min_avg_dollar_volume: 5.0e7               # underlying liquidity sanity floor

# Earnings handling: calls held INTO earnings are IV-driven event trades.
earnings:
  flag_window_days: 10             # earnings within N days -> "event trade" tag

# Data-quality guardrail: candidates assembled from too many fallbacks are
# marked low-confidence and penalised.
data_quality:
  min_acceptable: 0.30             # below this -> reject as "insufficient data"
  low_confidence_below: 0.55

# Realistic options backtest (person_intel/options_sim.py) — path-based BS reprice
# with conservative fills (ask in / bid out), spread/slippage, theta + vega, and
# daily exit rules. Used by `outcomes-report --realistic`. Report-only; the system
# never trades.
options_backtest:
  take_profit: 1.00          # +100% of premium -> take profit
  stop_loss: 0.50            # -50% of premium  -> stop loss
  time_stop_days: 30         # max calendar days held
  min_dte: 7                 # exit if remaining DTE falls below this (theta/gamma cliff)
  iv_crush_exit_pts: 0.15    # exit if IV collapses >= this many points vs entry
  entry_haircut: 0.50        # fraction of half-spread paid crossing toward the ask
  exit_haircut: 0.50         # fraction of half-spread given crossing toward the bid
  assumed_spread_pct: 0.06   # bid/ask spread used when only a mid is known
  risk_free_rate: 0.04

# Forward EV hard-gate (person_intel/ev_gate.py) — the FOURTH, decisive gate. A
# CALL candidate may only emerge when its actual contract carries a plausibly
# positive expected value AFTER costs (Monte-Carlo of the real option through the
# realistic engine: ask-in/bid-out fills, BS theta+vega reprice, daily exit rules)
# AND no hard data/liquidity/timing guard trips. The liquidity floors and DTE
# window are READ FROM the `liquidity:` and `dte:` blocks above (single source of
# truth); only EV-specific knobs live here.
ev_gate:
  ev_min: 0.0                         # required mean option P&L after costs (>0 = positive expectancy)
  n_paths: 1500                       # Monte-Carlo paths (seeded → deterministic)
  seed: 7
  require_iv_history: true            # no IV-rank → cannot judge richness → HARD reject
  block_earnings_in_window: true      # earnings inside the holding window → HARD reject
  # The thesis is the ONLY directional edge. drift = signal_to_drift_annual_max ×
  # (final_trade_score / 10). This is an UNVALIDATED PRIOR, not a fitted value —
  # the accumulating real outcomes + walk-forward backtest are what validate it.
  # Set to 0.0 to demand an explicitly-supplied, evidence-based catalyst drift.
  signal_to_drift_annual_max: 0.25
  default_catalyst_drift_annual: 0.0  # drift used when no signal score is supplied
