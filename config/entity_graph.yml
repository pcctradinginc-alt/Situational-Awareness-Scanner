# Entity graph — tracked people and the vehicles that carry their signal.
# ----------------------------------------------------------------------
# Goal A. FACTS and HYPOTHESES are typed separately (`is_fact`), and every
# relation carries its own `confidence`. Person-scoring discounts a signal by
# the confidence of the controlled-entity PATH it travels through, so a position
# held by a CONFIRMED controlled vehicle counts more than one held by a merely
# HYPOTHESISED affiliate.
#
# `evidence` is a SHORT pointer (filer note / public-record description) — never
# stored full third-party text. CIKs mirror config/investors_13f.yml (verified
# against SEC EDGAR submissions API 2026-06-25).
#
# confidence ∈ {confirmed, high, medium, low, speculative}
# type       ∈ {person, fund, management_company, growth_fund,
#               portfolio_company, index_proxy}

